name: Validate App Spec

on:
  push:
    branches: [deploy]
    paths:
      - .do/**
      - .github/workflows/validate-app-spec.yml
  pull_request:
    branches: [deploy]
    paths:
      - .do/**
      - .github/workflows/validate-app-spec.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # `secrets` is allowed in jobs.<id>.env but not in steps.if, so expose
      # the token's presence here and branch on env.HAS_DO_TOKEN below.
      HAS_DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: YAML syntax check
        if: ${{ env.HAS_DO_TOKEN != 'true' }}
        run: |
          python3 -m pip install --user pyyaml
          python3 - <<'PY'
          import sys, yaml
          path = ".do/app.yaml"
          try:
              with open(path) as f:
                  yaml.safe_load(f)
          except FileNotFoundError:
              print(f"::error::App spec not found at {path}")
              sys.exit(1)
          except yaml.YAMLError as e:
              print(f"::error::YAML parse error in {path}: {e}")
              sys.exit(1)
          print(f"YAML syntax OK: {path}")
          PY

      - name: Install doctl
        if: ${{ env.HAS_DO_TOKEN == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Validate App Platform spec
        if: ${{ env.HAS_DO_TOKEN == 'true' }}
        run: doctl apps spec validate .do/app.yaml